server:
  port: 8080

spring:
  application:
    name: freight-system
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url: jdbc:mysql://localhost:3306/KFIC?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456789
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  sql:
    init:
      mode: always
      schema-locations: classpath:migration_announcement.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.freight.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:freight-system-secret-key-2024-must-be-at-least-256-bits-long!!}
  access-expiration: 7200000
  refresh-expiration: 2592000000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

aisstream:
  # 是否启用 AISStream 实时连接；当前本地限流冷却中先停用，恢复时改为 true 或设环境变量 AISSTREAM_ENABLED=true
  enabled: ${AISSTREAM_ENABLED:false}
  # AISStream 实时 AIS 数据流 API Key（可用环境变量 AISSTREAM_API_KEY 覆盖）
  api-key: ${AISSTREAM_API_KEY:}

shipxy:
  # ShipXY 船舶搜索与单船位置查询密钥，仅从环境变量读取
  api-key: ${SHIPXY_API_KEY:}

intelink:
  # 天富行 OIS 接口配置。生产环境建议通过环境变量覆盖，密钥不会下发到前端。
  base-url: ${INTELINK_BASE_URL:https://openapi.intelink.net.cn}
  app-key: ${INTELINK_APP_KEY:GZWH1694_10346}
  app-secret: ${INTELINK_APP_SECRET:}
